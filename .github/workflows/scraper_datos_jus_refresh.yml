name: 🌐 Refresh datos.jus.gob.ar (datos_jus/) — Mensual

# ─────────────────────────────────────────────────────────────────────────────
# POR QUÉ EXISTE ESTE WORKFLOW
# ─────────────────────────────────────────────────────────────────────────────
# La carpeta datos_jus/ (fuente principal de designaciones, renuncias, CVs y
# magistrados para el dashboard "Estratégico") es hoy un volcado ÚNICO —
# datos_jus_meta.json marca "inicio": "2026-04-17" y "datasets_fallidos": 2 —
# generado corriendo scraper_datos_jus_completo.py a mano. Ningún workflow
# existente lo vuelve a ejecutar, así que esos datos quedan cada vez más
# viejos aunque el resto del sitio parezca actualizarse a diario.
#
# Este workflow corre scraper_datos_jus_resiliente.py — un wrapper NUEVO que
# importa scraper_datos_jus_completo.py sin modificarlo, sube el timeout de
# 30s a 90s y agrega 3 reintentos con backoff. Se agregó después de que la
# primera corrida de este workflow falló: los 6 datasets dieron
# "Read timed out (timeout=30)" contra datos.jus.gob.ar. Se confirmó por
# fuera de GitHub Actions (curl directo) que el portal no respondía en ese
# momento — no era un problema de este workflow ni del scraper.
#
# Frecuencia mensual porque son datasets publicados por el Estado que no
# cambian todos los días — ajustá el cron si el organismo empieza a publicar
# con más frecuencia. No modifica ningún archivo existente, sólo agrega este
# workflow + scraper_datos_jus_resiliente.py.
#
# 2026-07-07: agregado git fetch + rebase antes del push final. El job puede
# tardar 10-30 min por los reintentos del wrapper resiliente; si en ese
# tiempo alguien pushea otro commit a main, el "git push" de este job
# quedaba rechazado (non-fast-forward) y el commit de datos se perdía en el
# runner efímero (pasó justo con el run que trajo "designaciones").
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 5 1 * *"   # Día 1 de cada mes, 05:00 UTC
  workflow_dispatch:
    inputs:
      solo:
        description: "IDs de dataset a procesar (separados por espacio). Vacío = todos los prioritarios."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh-datos-jus:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Mismo criterio que el resto de los workflows del repo: dependencias
      # explícitas en vez de `pip install -r requirements.txt` (ese archivo
      # está en un encoding que pip no interpreta bien).
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: 🌐 Descargar datasets de datos.jus.gob.ar (con reintentos)
        run: |
          if [ -n "${{ github.event.inputs.solo }}" ]; then
            python scraper_datos_jus_resiliente.py --solo ${{ github.event.inputs.solo }}
          else
            python scraper_datos_jus_resiliente.py
          fi

      - name: ✅ Verificar resultado
        run: |
          python -c "
          import json, sys
          with open('datos_jus/datos_jus_meta.json', encoding='utf-8') as f:
              meta = json.load(f)
          print(f\"Datasets OK      : {meta['datasets_ok']}\")
          print(f\"Datasets fallidos: {meta['datasets_fallidos']}\")
          print(f\"Filas totales    : {meta['filas_total']:,}\")
          print(f\"Corrida          : {meta['inicio']} → {meta['fin']}\")
          if meta['datasets_ok'] == 0:
              print('ERROR: no se descargó ningún dataset — no se commitea (ver si datos.jus.gob.ar sigue caído)')
              sys.exit(1)
          "

      - name: 📤 Commit y push de datos_jus/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f datos_jus/
          if git diff --staged --quiet; then
            echo "Sin cambios en datos_jus/."
          else
            git commit -m "data: refresh datos.jus.gob.ar $(date -u '+%Y-%m-%d')"
            # El job puede tardar 10-30 min por los reintentos del wrapper
            # resiliente. Si en ese tiempo se pushea otro commit a main (por
            # ejemplo, un fix subido a mano), "git push" solo rechaza por
            # "non-fast-forward" y el commit de esta corrida se pierde en el
            # runner efimero. Por eso: pull --rebase antes de pushear, para
            # traer lo nuevo de main y reintentar el push arriba de eso.
            git fetch origin main
            git rebase origin/main || {
              echo "ERROR: rebase con conflictos - abortando rebase, se pierde este commit de datos.";
              git rebase --abort;
              exit 1;
            }
            git push
          fi