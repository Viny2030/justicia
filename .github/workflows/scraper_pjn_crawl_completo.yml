name: 🏛️ Crawl Completo PJN (causas/oralidad) — Semanal

# ─────────────────────────────────────────────────────────────────────────────
# POR QUÉ EXISTE ESTE WORKFLOW
# ─────────────────────────────────────────────────────────────────────────────
# El workflow "scraper_diario.yml" (ya existente, no se toca) corre TODOS los
# días pero con la bandera `--skip-crawl`, es decir: sólo re-cruza los CSVs
# YA descargados con los datos de magistrados/vacantes del día. NUNCA vuelve a
# bajar estadísticas nuevas de estadisticas.pjn.gov.ar. Como consecuencia, los
# indicadores operativos por juzgado (clearance_rate, disposition_time,
# pct_mora, pendientes) que alimentan /operativo/nacional quedan congelados
# en la última vez que alguien corrió el script completo a mano.
#
# Este workflow nuevo corre `scraper_juzgados_nacional.py` SIN --skip-crawl.
#
# 2026-07-08 — REESCRITO: el crawl real (`crawl_pjn` + `descargar_url`, con
# requests+BeautifulSoup sobre <a href>) nunca encontraba nada porque (a) las
# rutas SEEDS (civil.php, comercial.php...) dan 404 desde que el sitio se
# reescribió con ruteo CodeIgniter, y (b) el buscador en cascada
# Año/Jurisdicción del HTML actual llama a endpoints JSON que ignoran los
# parámetros que reciben y devuelven siempre el mismo resultado fijo — un bug
# del backend PHP, no de renderizado JS (así que Playwright/Selenium tampoco
# lo hubiera arreglado: un navegador real manda el mismo GET y recibe la misma
# respuesta rota). El crawl real ahora vive en pjn_id_crawler.py: enumera
# index.php/getUrlDescarga?id=N directo (bypassea el filtro roto) y baja cada
# archivo real, clasificado por formato — CSV crudo (cp1250, formato legado
# que ya parseaba scraper_estadisticas.py), .xls "libro" viejos y PDFs de
# resumen (estos dos últimos se vuelcan best-effort con pjn_extraer_libro_xls.py
# y pjn_extraer_pdf_tablas.py — no se mapean a los campos del IRA todavía).
# Ver el docstring de pjn_id_crawler.py para el detalle completo.
#
# Frecuencia semanal (no diaria) porque el crawl completo sondea ~9500 IDs
# contra el sitio — no es agresivo (JSON liviano + descargas paralelas, unos
# pocos minutos en total) pero tampoco aporta nada correrlo a diario: las
# estadísticas oficiales no se actualizan tan seguido. Ajustá el cron si
# preferís otra cadencia.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 5 * * 3"   # Miércoles 05:00 UTC = 02:00 ART — no pisa a scraper_diario.yml (06:00 UTC) ni a update_magistrados.yml (06:00 UTC)
  workflow_dispatch:
    inputs:
      max_pages:
        description: "ID máximo a sondear contra getUrlDescarga (vacío = default del script, ~9500). El nombre quedó de la versión vieja por compatibilidad, pero ahora cuenta IDs de archivo, no páginas HTML."
        required: false
        default: ""
      resume:
        description: "Retomar desde el checkpoint (pjn_id_checkpoint.json) — no persiste entre corridas del workflow porque el runner es efímero y esos archivos crudos están en .gitignore, así que cada corrida semanal hace un crawl completo de cero igual."
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  crawl-completo:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # el crawl completo tarda más que el modo --skip-crawl

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # NOTA: se instalan las dependencias explícitas del scraper (igual que
      # hace scraper_diario.yml) en vez de `pip install -r requirements.txt`,
      # porque ese archivo está guardado en un encoding que pip no parsea bien.
      # 2026-07-08: se agregan xlrd (lee los .xls "libro" viejos) y pdfplumber
      # (extrae tablas de los PDF de resumen) — las usan pjn_extraer_libro_xls.py
      # y pjn_extraer_pdf_tablas.py. Se sacan beautifulsoup4/lxml: ya no se
      # crawlea HTML, todo el descubrimiento de archivos es vía JSON (requests solo).
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl xlrd pdfplumber

      - name: 🏛️ Crawl completo estadisticas.pjn.gov.ar
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            ARGS="--max-pages ${{ github.event.inputs.max_pages }}"
          fi
          if [ "${